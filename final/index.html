<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Travel choices survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#18212B; --muted:#56606B; --line:#D3D9DF; --bg:#ECEFF1; --card:#FFFFFF;
  --go:#0B6E4F; --go-weak:#E4F2EC; --go-dark:#07563D; --err:#B42318; --err-weak:#FDECEA; --route:#0B6E4F;
  --r-lg:14px; --r-sm:8px;
  font-size:17px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:110px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px}
.top-inner,.wrap{max-width:560px;margin:0 auto}
.brandline{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:#D6DCE1;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--go);transition:width .3s}
.wrap{padding:6px 16px 140px}
h1{font-size:1.6rem;line-height:1.2;margin:.4rem 0 .8rem;letter-spacing:-.01em}
h2{font-size:1.2rem;line-height:1.3;margin:1.4rem 0 .5rem}
p{margin:.5rem 0 .9rem;max-width:62ch}
.lead{font-size:1.06rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.panel{background:var(--card);border-radius:var(--r-lg);padding:16px;margin:12px 0;border:1px solid var(--line)}
.note{border-left:4px solid var(--ink);background:#fff;padding:10px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:14px 0}
ul.plain{padding-left:1.1rem;margin:.3rem 0 .9rem} ul.plain li{margin:.25rem 0}

/* questions */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 12px;margin:14px 0}
.q.has-error{border-color:var(--err);box-shadow:0 0 0 2px var(--err-weak)}
.q legend,.q .qlabel{font-weight:700;font-size:1.02rem;margin-bottom:8px;display:block;padding:0}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q .hint{font-size:.86rem;color:var(--muted);margin:-4px 0 8px}
.err{display:none;color:var(--err);font-size:.9rem;font-weight:700;margin-top:6px}
.q.has-error .err{display:block}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;margin:6px 0;padding:10px 14px;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer}
.opt::before{content:"";flex:0 0 20px;height:20px;border-radius:50%;border:2px solid #8A949E;background:#fff}
.opt[aria-checked="true"]{border-color:var(--go);background:var(--go-weak)}
.opt[aria-checked="true"]::before{border-color:var(--go);background:radial-gradient(circle,var(--go) 0 5px,#fff 6px)}
select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:inherit}
select{min-height:52px}
textarea{min-height:90px;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt{justify-content:center;padding:10px 0}
.scale .opt::before{display:none}
.feedback{margin-top:8px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.feedback.ok{background:var(--go-weak)} .feedback.no{background:#FFF4E5}

/* explain */
.pods{display:grid;gap:12px;margin:12px 0}
@media (min-width:520px){.pods .pod:nth-child(3){grid-column:1/-1}}
.pod{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pod img{display:block;width:100%;height:auto;background:#f3f3f3}
.pod div{padding:10px 14px 12px}
.pod h3{margin:0 0 2px;font-size:1.05rem}
.pod p{margin:0;font-size:.95rem}
@media (min-width:520px){.pods{grid-template-columns:1fr 1fr}}
.concepts{display:grid;gap:10px;margin:10px 0}
.concepts div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.concepts b{display:block}
.hero{margin:6px 0 14px}
.hero img{display:block;width:100%;height:auto;border-radius:var(--r-lg);background:#DDE3E8}
.hero figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}

/* map */
.map-fallback{height:300px;border-radius:var(--r-lg);border:1px solid var(--line);background:#fff;margin:10px 0 4px;overflow:hidden}
.map-fallback svg{width:100%;height:100%;display:block}
.routemap{margin:10px 0 4px}
.routemap a{display:block;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#F6F5F1}
.routemap img{display:block;width:100%;height:auto}
.routemap figcaption{font-size:.84rem;color:var(--muted);margin-top:6px}
.stop-label{background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;font-weight:700;font-size:12px;white-space:nowrap;box-shadow:none}
.stop-label::before{display:none}

/* choice tables: one row per option, one column per attribute */
.trip{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);margin:0 0 4px}
.trip .count{margin-left:auto;white-space:nowrap;font-weight:700;color:var(--ink)}
.trip svg{flex:0 0 auto}
.task-q{font-size:1.15rem;margin:.1rem 0 .2rem}
.task-help{font-size:.86rem;color:var(--muted);margin:0 0 8px}
.wrap.tight{padding-left:8px;padding-right:8px}
.wrap.tight .trip,.wrap.tight .task-q,.wrap.tight .task-help,.wrap.tight .count,.wrap.tight .context{margin-left:8px;margin-right:8px}
.cmp{--cols:28px 68px minmax(40px,.9fr) minmax(54px,1.2fr) 68px 30px 30px 34px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cmp.b{--cols:30px minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,.95fr) minmax(0,1.1fr)}
.cmp.b .c-key .num{font-size:.98rem}
.cmp-head,.crow{display:grid;grid-template-columns:var(--cols)}
.cmp-head{background:#F4F6F7;border-bottom:2px solid var(--ink);font-size:.7rem;line-height:1.2;color:var(--muted);font-weight:700}
.cmp-head>div{padding:7px 2px;display:flex;align-items:flex-end;justify-content:center;text-align:center}
.cmp-head .h-opt{grid-row:1/3;grid-column:1/3;justify-content:flex-start;padding-left:10px}
.cmp-head .h-key{grid-row:1/3;color:var(--ink);font-size:.76rem;background:#E7EFEA}
.cmp-head .h-share{grid-row:1/3;border-left:1px solid var(--line)}
.cmp-head .h-group{grid-column:6/9;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:400}
.cmp-head .h-sub{font-weight:400;padding-top:4px}
.cmp-head .h-sub{border-left:1px solid var(--line)}
.crow{width:100%;margin:0;padding:0;border:0;border-top:1px solid var(--line);background:var(--card);font:inherit;color:inherit;
  cursor:pointer;text-align:center;position:relative;min-height:58px}
.crow:first-of-type{border-top:0}
.crow>.c{padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.crow .c-key{background:#F3F8F5}
.crow .c-share{border-left:1px solid var(--line)}
.crow .c-sub{border-left:1px solid var(--line)}          /* lines between walk, wait and travel */
.crow .c-sub.first{border-left-color:#AEB6BD}
.crow .c-opt{align-items:flex-start;text-align:left;padding-left:2px;gap:4px}
.crow>.c-radio{padding:0 0 0 6px;align-items:center}
.crow .c-opt .pic{position:relative;width:54px;height:33px;border-radius:6px;overflow:hidden;background:#EEF1F3;flex:0 0 auto}
.crow .c-opt .pic img,.crow .c-opt .pic svg{display:block;width:100%;height:100%;object-fit:cover}
.crow .c-opt b{font-size:.72rem;line-height:1.15;hyphens:auto;-webkit-hyphens:auto}
.crow .num{font-weight:700;font-size:1.02rem;line-height:1.1}
.crow .c-key .num{font-size:1.08rem;white-space:nowrap}
.crow .c-price .num{font-size:.95rem}
.crow .unit{font-size:.68rem;color:var(--muted);line-height:1.1}
.crow .c-sub .num{font-weight:400;font-size:.98rem}
.crow .na{color:#9AA3AB;font-size:.95rem}
.crow .shr{font-size:.72rem;line-height:1.15;margin-top:3px}
.crow .tag{display:block;overflow-wrap:anywhere;margin-top:4px;padding:1px 4px;border-radius:5px;background:#E9EDF0;font-size:.64rem;line-height:1.25;font-weight:700;max-width:100%}
.radio{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2.5px solid #6B757F;background:#fff;display:grid;place-items:center}
.crow[aria-checked="true"]{background:var(--go-weak);box-shadow:inset 5px 0 0 var(--go),inset 0 0 0 2px var(--go)}
.crow[aria-checked="true"] .c-key{background:rgba(11,110,79,.1)}
.crow[aria-checked="true"] .radio{background:var(--go);border-color:var(--go)}
.crow[aria-checked="true"] .radio::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.crow[aria-disabled="true"] .radio{border-color:#C3C9CE;background:#EEF1F3}
.crow[aria-disabled="true"]{cursor:not-allowed;background:#F4F6F7}
.crow[aria-disabled="true"]>.c{opacity:.4}
.crow[aria-disabled="true"] .c-opt,.crow[aria-disabled="true"] .c-radio{opacity:1}
.crow[aria-disabled="true"] .c-opt .off{font-size:.66rem;color:var(--err);font-weight:700;line-height:1.15}
.crow:focus-visible{outline:3px solid #1B4DB3;outline-offset:-3px}
.cmp.b .crow .c-opt{padding:8px 6px 8px 4px;justify-content:center}
.cmp.b .crow .c-opt b{font-size:.86rem}
.cmp.b .cmp-head>div{grid-row:auto}
.crow .seat-txt{font-size:.68rem;line-height:1.15;margin-top:3px;color:var(--muted)}
.crow .seat-txt.standing{color:#8A4B00;font-weight:700}
.legend{font-size:.78rem;color:var(--muted);margin:10px 8px 0;line-height:1.45}
.legend p{margin:0 0 4px;max-width:none}
.context{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r-sm);padding:10px 14px;margin:6px 0 12px}
.count{margin:0}
@media (max-width:370px){
  .cmp{--cols:26px 64px minmax(38px,.9fr) minmax(50px,1.2fr) 62px 27px 27px 32px}
  .crow .tag{font-size:.6rem}
  .crow>.c{padding-top:5px;padding-bottom:5px}
  .crow .c-opt .pic{width:48px;height:29px}
  .radio{flex-basis:20px;width:20px;height:20px}
  .crow .c-price .num{font-size:.88rem}
  .crow .c-opt b{font-size:.64rem}
  .cmp-head .h-sub{font-size:.6rem;padding-left:0;padding-right:0}
  .crow .num{font-size:.95rem} .crow .c-key .num{font-size:1rem} .crow .c-sub .num{font-size:.9rem}
}
@media (min-width:540px){
  .cmp{--cols:40px 110px 1fr 1fr 96px 1fr 1fr 1fr}
  .crow .c-opt .pic{width:88px;height:54px}
  .crow .c-opt b{font-size:.84rem}
  .cmp-head{font-size:.78rem}
}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(236,239,241,.96);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .row{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:12px;min-height:54px;padding:0 18px;cursor:pointer;border:2px solid transparent}
.btn-main{flex:1;background:var(--go);color:#fff}
.btn-main:disabled{background:#AEB7BF;cursor:not-allowed}
.btn-main.pulse{animation:pulse .6s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(11,110,79,.45)}100%{box-shadow:0 0 0 14px rgba(11,110,79,0)}}
.btn-back{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-inline{width:100%;background:var(--go);color:#fff;margin-top:8px}
.hidden{display:none!important}
:focus-visible{outline:3px solid #1B4DB3;outline-offset:2px}
.modal-bg{position:fixed;inset:0;z-index:30;background:rgba(24,33,43,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:1.25rem}
.modal p{margin:0 0 16px}
.modal .mbtns{display:flex;flex-direction:column;gap:10px}
.modal .btn{width:100%}
@media (min-width:540px){.modal-bg{align-items:center}}
.again{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.again .btn{width:100%;margin-top:6px}
.ref{font-size:1.4rem;font-weight:700;letter-spacing:.04em;background:#fff;border:1.5px dashed var(--ink);padding:10px 14px;border-radius:10px;display:inline-block}
.alert{background:var(--err-weak);border:1.5px solid var(--err);color:#5c130c;border-radius:10px;padding:12px 14px;margin:10px 0}
.sending{display:flex;align-items:center;gap:10px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid #cfd6dc;border-top-color:var(--go);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}

</style>
</head>
<body>
<header class="top" aria-label="Progress">
  <div class="top-inner">
    <div class="brandline"><span>Travel choices survey</span><span id="stepText"></span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barFill"></i></div>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<footer class="foot" id="foot">
  <div class="row">
    <button class="btn btn-back" id="backBtn" type="button">Back</button>
    <button class="btn btn-main" id="nextBtn" type="button">Next</button>
  </div>
</footer>
<div class="modal-bg" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
    <h2 id="mTitle"></h2><p id="mText"></p>
    <div class="mbtns"><button class="btn btn-main" id="mYes" type="button"></button><button class="btn btn-back" id="mNo" type="button"></button></div>
  </div>
</div>

}
function shuffle(x) { const a = x.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function assignBlock(done) {
  if (S.block) return done();
  const setOrder = () => {
    const est = CFG.design.gameA.filter(t => t.block === S.block && !t.is_holdout).map(t => t.task_id);
    const hold = CFG.design.gameA.filter(t => t.block === S.block && t.is_holdout).map(t => t.task_id);
    const order = shuffle(est); order.splice(5, 0, ...hold);            // holdout shown 6th
    S.orderA = order;
    S.orderB = CFG.gameB_enabled ? shuffle(CFG.design.gameB.filter(t => t.block === S.block).map(t => t.b_task_id)) : [];
    save(); buildScreens(); done();
  };
  const fallback = () => { if (!S.block) { S.block = 1 + Math.floor(Math.random() * 4); S.block_source = "random"; setOrder(); } };
  if (!CFG.endpoint) return fallback();
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 2500);
  fetch(CFG.endpoint + "?action=block", {signal: ctl.signal}).then(r => r.json()).then(j => {
    clearTimeout(timer);
    if (!S.block && j && [1, 2, 3, 4].includes(j.block)) { S.block = j.block; S.block_source = "server"; setOrder(); } else fallback();
  }).catch(() => { clearTimeout(timer); fallback(); });
}

    <div class="legend">

function tableB(t) {

function screenHTML(s) {

  if (s === "consent") return `

      <div class="pod"><img src="img/pod_p5.jpg" alt="A busy Glydways pod: four passengers seated and one standing" width="720" height="511" loading="lazy">

  if (s === "comprehension") return `<h1>A quick check</h1><p class="muted">This helps us know the explanation was clear.</p>` + qHTML("comprehension");

    <figure class="routemap" id="map"><a href="${CFG.static_map}" target="_blank" rel="noopener">

      <figcaption>Tap the map to see it larger.</figcaption></figure>

    <div class="panel"><h2 style="margin-top:0">What to do</h2><ul class="plain">

  if (s.startsWith("A:")) {

    if (!carOK() && S.choiceA[s] === 5) delete S.choiceA[s];
    return `<div class="trip">${TRIP_SVG}<span>Sutton to South Wimbledon, weekday 8am</span><span class="count">${i + 1} of ${nA}</span></div>
      <h1 class="task-q">Which would you choose for this trip?</h1>

  if (s === "pilot") return `<h1>Help us improve the survey</h1><p class="muted">These questions only appear in the test version.</p>` + PAGEQ.pilot.map(qHTML).join("");

}
function submitHTML() {
  const st = S._sendState || "ready";
  let body = `<h1>Send your answers</h1><p class="lead">You have answered all the questions. Press the button to send your answers.</p>`;
  if (st === "sending") body += `<div class="panel sending" role="status"><span class="spin"></span>Sending your answers…</div>`;
  if (st === "error") body += `<div class="alert" role="alert"><b>Your answers were not sent.</b> They are still saved on this device. Check your internet connection, then press Try again.${S._sendError ? `<br><span class="small">${S._sendError}</span>` : ""}</div>`;
  return body;
}

/* ------------------------------------------------------------ rendering */
let enteredAt = Date.now();
function cur() { return S.screenout ? "screenout" : S.submitted ? "done" : SCREENS[S.screen]; }
function render(scrollTop = true) {
  const s = cur(); S._cur = s;
  $("#main").classList.toggle("tight", s.startsWith("A:") || s.startsWith("B:"));
  $("#main").innerHTML = screenHTML(s);
  bind(s);
  const pos = S.submitted || S.screenout ? SCREENS.length : S.screen;
  const pct = Math.round(100 * pos / SCREENS.length);
  $("#barFill").style.width = pct + "%"; $("#bar").setAttribute("aria-valuenow", pct);
  $("#stepText").textContent = (S.submitted || S.screenout) ? "Finished" : `Step ${S.screen + 1} of ${SCREENS.length}`;
  $("#backBtn").classList.toggle("hidden", S.screen === 0 || s === "done" || s === "screenout" || S._sendState === "sending");
  $("#foot").classList.toggle("hidden", s === "done" || s === "screenout");
  updateNext();
  if (scrollTop) { window.scrollTo({top: 0, behavior: "auto"}); $("#main").focus({preventScroll: true}); }
  if (s === "journey") drawMap();
  enteredAt = Date.now();
}
function screenComplete(s) {
  if (s === "consent") return S.answers.consent === 1;
  if (PAGEQ[s]) return visibleQs(s).every(id => Q[id].optional || (S.answers[id] !== undefined && S.answers[id] !== ""));
  if (s.startsWith("A:")) return !!S.choiceA[s];
  if (s.startsWith("B:")) return !!S.choiceB[s];
  return true;
}
function updateNext() {
  const s = cur(); const b = $("#nextBtn");
  if (s === "submit") {
    const st = S._sendState || "ready";
    b.textContent = st === "error" ? "Try again" : st === "sending" ? "Sending…" : "Submit my answers";
    b.disabled = st === "sending";
    return;
  }
  b.textContent = s === "consent" ? "Start" : "Next";
  const needsChoice = s.startsWith("A:") || s.startsWith("B:");
  b.disabled = needsChoice && !screenComplete(s);
}
function nextTarget(fromEl) {
  const qs = $$(".q", $("#main"));
  const i = qs.indexOf(fromEl);
  for (let k = i + 1; k < qs.length; k++) {
    const id = qs[k].id.slice(2);
    if (S.answers[id] === undefined || S.answers[id] === "") return qs[k];
  }
  return null;
}
function scrollToEl(el, block = "start") {
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - 70;
  if (block === "start") window.scrollTo({top: Math.max(0, y), behavior: smooth});
  else el.scrollIntoView({behavior: smooth, block});
}
function afterAnswer(qEl) {
  save(); qEl.classList.remove("has-error");
  const s = cur();
  const t = nextTarget(qEl);
  if (t) setTimeout(() => scrollToEl(t), 180);
  else setTimeout(() => { window.scrollTo({top: document.body.scrollHeight, behavior: smooth}); pulse(); }, 180);
  updateNext();
}
function pulse() { const b = $("#nextBtn"); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); }

function restart() {
  const prev = S.ref;
  try { localStorage.removeItem(KEY); } catch (e) {}
  S = newState(); S.previous_ref = prev || ""; save(); buildScreens(); render(true);
}
function bind(s) {
  const rb = $("#restartBtn");
  if (rb) rb.addEventListener("click", () => ask("Start a new response?",
    "The survey will start again from the beginning on this device. The answers already sent are kept.",
    "Start again", "Cancel", restart));
  $$(".opt[data-q]").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.dataset.q; const v = +btn.dataset.v;
    if (id === "comprehension") {
      if (!S.answers.comprehension_seen) S.answers.comprehension = v;   // record the first answer only
      S.answers.comprehension_seen = 1; S.answers.comprehension_last = v;
      $$(`.opt[data-q="${id}"]`).forEach(o => o.setAttribute("aria-checked", String(+o.dataset.v === v)));
      $("#fb").outerHTML = feedbackHTML(); save(); updateNext(); pulse(); return;
    }
    S.answers[id] = v;
    if (id === "licence") {                                               // car question depends on licence
      if (v !== 1) delete S.answers.car_avail;
      render(false); const el = v === 1 ? $("#q_car_avail") : null; if (el) setTimeout(() => scrollToEl(el), 150); else pulse();
      save(); return;
    }
    $$(`.opt[data-q="${id}"]`).forEach(o => o.setAttribute("aria-checked", String(+o.dataset.v === v)));
    afterAnswer(btn.closest(".q"));
  }));
  $$("select[data-q]").forEach(sel => sel.addEventListener("change", () => {
    S.answers[sel.dataset.q] = sel.value ? +sel.value : ""; afterAnswer(sel.closest(".q"));
  }));
  $$("textarea[data-q]").forEach(tx => tx.addEventListener("input", () => { S.answers[tx.dataset.q] = tx.value.slice(0, 600); save(); }));
  $$(".mode[data-alt]").forEach(card => card.addEventListener("click", () => {
    if (card.getAttribute("aria-disabled") === "true") return;
    const alt = +card.dataset.alt;
    if (s.startsWith("A:")) S.choiceA[s] = alt; else S.choiceB[s] = alt;
    $$(".mode[data-alt]").forEach(c => c.setAttribute("aria-checked", String(c === card)));
    save(); updateNext(); pulse();
    const r = card.getBoundingClientRect();
    if (r.bottom > window.innerHeight - 90) window.scrollBy({top: r.bottom - (window.innerHeight - 96), behavior: smooth});
    setTimeout(() => $("#nextBtn").focus({preventScroll: true}), 50);
  }));
  $$(".cards[role=radiogroup]").forEach(g => g.addEventListener("keydown", e => {
    if (!["ArrowDown", "ArrowUp"].includes(e.key)) return;
    const cards = $$(".mode:not([aria-disabled=true])", g); const i = cards.indexOf(document.activeElement);
    const n = cards[(i + (e.key === "ArrowDown" ? 1 : cards.length - 1)) % cards.length]; if (n) { e.preventDefault(); n.focus(); }
  }));
}

function recordTime(s) { S.rt[s] = (S.rt[s] || 0) + (Date.now() - enteredAt); }
function go(delta) {
  const s = cur();
  recordTime(s);
  S.screen = Math.min(Math.max(0, S.screen + delta), SCREENS.length - 1);
  save(); render(true);
}
/* ------------------------------------------------------------ pop-up */
let modalYes = null, modalFrom = null;
function ask(title, text, yes, no, onYes) {
  $("#mTitle").textContent = title; $("#mText").textContent = text; $("#mYes").textContent = yes; $("#mNo").textContent = no;
  modalYes = onYes; modalFrom = document.activeElement; $("#modal").hidden = false; $("#mYes").focus();
}
function closeModal() { $("#modal").hidden = true; modalYes = null; if (modalFrom && modalFrom.focus) modalFrom.focus({preventScroll: true}); }
$("#mYes").addEventListener("click", () => { const f = modalYes; closeModal(); if (f) f(); });
$("#mNo").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if (e.target === $("#modal")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });

$("#nextBtn").addEventListener("click", () => {
  const s = cur();
  if (s === "submit") {
    if ((S._sendState || "ready") === "error" || inflight) return submit();       // Try again: no second question
    return ask("Send your answers?", "Please check you are happy with your answers. You cannot change them after sending.",
      "Yes, send my answers", "Go back and check", submit);
  }
  if (!screenComplete(s)) {
    const missing = (s === "consent" ? [$("#q_consent")] : visibleQs(s).filter(id => !Q[id].optional && (S.answers[id] === undefined || S.answers[id] === "")).map(id => $("#q_" + id)));
    missing.forEach(el => el && el.classList.add("has-error"));
    if (missing[0]) scrollToEl(missing[0]);
    return;
  }
  if (s === "eligibility" && (S.answers.age18 === 2 || (!INTL && S.answers.london === 4))) { recordTime(s); S.screenout = true; save(); return render(true); }
  if (s === "consent" && !S.block) {
    $("#nextBtn").disabled = true; $("#nextBtn").textContent = "Loading…";
    return assignBlock(() => go(1));
  }
  go(1);
});
$("#backBtn").addEventListener("click", () => go(-1));

/* ------------------------------------------------------------ map */
// Static route map (img/route_map.png, drawn by make_route_map.py). No map servers are used:

/* ------------------------------------------------------------ submission */
function payload() {
  const a = {};
  Object.keys(Q).forEach(k => { if (S.answers[k] !== undefined) a[k] = S.answers[k]; });
  const start = new Date(S.started_at).getTime();
  return {
    respondent_id: S.rid, survey_mode: CFG.mode, variant: INTL ? "intl" : "uk", survey_version: CFG.version, design_version: CFG.design_version,
    is_test: S.is_test, block: S.block, block_source: S.block_source, consent: S.answers.consent === 1 ? 1 : 0,
    started_at: S.started_at, submitted_at: new Date().toISOString(), duration_sec: Math.round((Date.now() - start) / 1000),
    gameB_enabled: S.orderB.length > 0, answers: a,
    gameA: S.orderA.map((id, i) => ({task_id: id, choice: S.choiceA["A:" + i] || null, rt_ms: S.rt["A:" + i] || null})),
    gameB: S.orderB.map((id, i) => ({b_task_id: id, choice: S.choiceB["B:" + i] || null, rt_ms: S.rt["B:" + i] || null})),
    user_agent: navigator.userAgent, screen_w: window.innerWidth, previous_ref: S.previous_ref || ""
  };
}
function clientCheck(p) {
  const bad = [];
  if (p.gameA.some(r => !r.choice)) bad.push("some travel choices are missing");
  if (p.gameB.some(r => !r.choice)) bad.push("some station questions are missing");
  (INTL ? ["age18", "country", "income_rel", "licence", "comprehension"] : ["age18", "london", "income", "licence", "comprehension"]).forEach(k => { if (p.answers[k] === undefined) bad.push("a required answer is missing"); });
  return [...new Set(bad)];
}
let inflight = false;
function submit() {
  if (inflight || S.submitted) return;
  const p = S.out && S.out.respondent_id === S.rid ? Object.assign(S.out, {submitted_at: new Date().toISOString()}) : payload();
  const bad = clientCheck(p);
  if (bad.length) { S._sendState = "error"; S._sendError = "Please go back: " + bad.join(", ") + "."; render(false); return; }
  S.out = p; save();
  inflight = true; S._sendState = "sending"; S._sendError = ""; render(false);
  const finish = (ok, ref, msg) => {
    inflight = false;
    if (ok) { S.submitted = true; S.ref = ref; S._sendState = "done"; save(); render(true); }
    else { S._sendState = "error"; S._sendError = msg || ""; save(); render(false); }
  };
  
  if (!CFG.endpoint) return finish(false, "", "The survey is not connected to a server yet.");
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 30000);
  fetch(CFG.endpoint, {method: "POST", body: JSON.stringify(p), signal: ctl.signal})   // text/plain: no CORS preflight
    .then(r => r.json())
    .then(j => {
      clearTimeout(timer);
      if (j && j.ok && j.ref) return finish(true, j.ref);                     // saved: the collector always returns a reference
      if (j && j.ok && j.service) return finish(false, "", "The survey server answered as if this was a page visit, so nothing was saved (web app access must be set to Anyone).");
      finish(false, "", (j && j.errors || []).join("; "));
    })
    .catch(() => { clearTimeout(timer); finish(false, ""); });
}



window.addEventListener("pageshow", () => { if (S.orderA.length) buildScreens(); render(true); });
</script>
